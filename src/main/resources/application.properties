spring.application.name=tls-ssl

# ---------- TLS / HTTPS ----------
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:./certs/keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-alias=tls-ssl
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# Puerto HTTP que solo redirige a HTTPS
app.http-redirect-port=8080

# ---------- PostgreSQL ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
